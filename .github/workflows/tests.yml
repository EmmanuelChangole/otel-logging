name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate coverage report
        run: vendor/bin/phpunit --coverage-clover build/logs/clover.xml

      - name: Enforce minimum coverage
        env:
          MIN_COVERAGE: "70"
        run: |
          php -r '$xml=simplexml_load_file("build/logs/clover.xml"); if($xml===false){fwrite(STDERR,"Unable to load Clover report\n"); exit(1);} $metrics=$xml->project->metrics; $statements=(int)$metrics["statements"]; $covered=(int)$metrics["coveredstatements"]; $coverage=$statements>0?($covered*100/$statements):0; printf("Line coverage: %.2f%% (minimum: %s%%)\n",$coverage,getenv("MIN_COVERAGE")); if($coverage < (float)getenv("MIN_COVERAGE")){fwrite(STDERR,"Coverage check failed\n"); exit(1);} '
